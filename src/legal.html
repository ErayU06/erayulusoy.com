<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{meta_title}}</title>
<meta name="description" content="{{meta_desc}}">
<meta name="author" content="Eray Ulusoy">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="{{en_url}}">
<link rel="alternate" hreflang="tr" href="{{tr_url}}">
<link rel="alternate" hreflang="x-default" href="{{en_url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Eray Ulusoy">
<meta property="og:title" content="{{meta_title}}">
<meta property="og:description" content="{{meta_desc}}">
<meta property="og:url" content="{{url}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="https://erayulusoy.com/og-image.jpg">
<meta name="theme-color" content="#0F1626">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png">
<link rel="manifest" href="{{base}}site.webmanifest">
<link rel="preload" href="{{base}}assets/fonts/playfair-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}assets/fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}assets/style.css?v={{ver}}">
<script src="{{base}}assets/boot.js?v={{ver}}"></script>
</head>
<body class="legal-page">
<a class="skip" href="#main">{{skip}}</a>

<nav class="nav solid" aria-label="{{nav_label}}">
  <div class="wrap">
    <a class="mark" href="{{home}}">Eray Ulusoy <small>{{consulting}}</small></a>
    <div class="nav-right">
      <span class="lang" aria-label="{{lang_label}}">
        <a href="{{en_href}}" hreflang="en" lang="en" data-lang-link="en"{{en_current}}>EN</a><span aria-hidden="true">/</span><a href="{{tr_href}}" hreflang="tr" lang="tr" data-lang-link="tr"{{tr_current}}>TR</a>
      </span>
      <a class="btn" href="{{home}}#contact">{{n_contact}}</a>
    </div>
  </div>
</nav>

<main id="main" class="legal">
  <div class="wrap">
    <article>
      <p class="label"><a class="plain" href="{{home}}">← Eray Ulusoy</a></p>
      <h1>{{title}}</h1>
      <p class="lead">{{lead}}</p>
      {{body}}
      <p class="updated">{{updated_label}}: {{updated}}</p>
    </article>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="big">Eray<br>Ulusoy<em>.</em></div>
    <div class="meta"><span class="label">{{footer_tag}}</span><a class="plain" href="mailto:contact@erayulusoy.com">contact@erayulusoy.com</a><a class="plain" href="{{privacy_href}}">{{privacy_link}}</a><a class="plain" href="{{kvkk_href}}">{{kvkk_link}}</a><span>© 2026 Eray Ulusoy</span></div>
  </div>
</footer>
</body>
</html>
